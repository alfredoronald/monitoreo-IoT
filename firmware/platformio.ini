; ============================================================
; Monitoreo IoT - Firmware ESP32
; Plataforma: PlatformIO (gestiona librerías y compilación
; mejor que el IDE clásico de Arduino).
;
; Este es el mínimo inicial: solo la configuración del entorno.
; El código se desarrolla en la task de firmware
; (rama feature/firmware-esp32).
; ============================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8

build_flags =
    -Wall
    -Wextra

; Selección explícita. Hereda dependencias, velocidades e intervalos normales.
[env:esp32dev-mq135-demo]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D MQ135_SIMULATED_DEMO=1
